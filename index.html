<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینۆی رێستۆرانت</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #333; margin-bottom: 25px; }
        
        /* بۆکسی گەڕان */
        .search-box { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }

        /* بەشەکانی سەرەوە (Categories Filter) */
        .categories-nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .cat-btn { background: #6c757d; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .cat-btn.active, .cat-btn:hover { background: #007bff; }

        /* لیستی خواردنەکان */
        .menu-list { display: flex; flex-direction: column; gap: 15px; }
        .food-row { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.08); display: flex; align-items: center; padding: 12px; gap: 15px; }
        .food-row img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .food-info { flex-grow: 1; }
        .food-info h3 { margin: 0 0 5px 0; color: #333; font-size: 18px; }
        .food-info p { color: #28a745; font-weight: bold; margin: 0; font-size: 15px; }
        .order-btn { background-color: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        .order-btn:hover { background-color: #218838; }

        /* سەبەتە */
        .cart-box { margin-top: 35px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 15px; }
        .checkout-btn { background-color: #ffc107; color: #333; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; font-size: 16px; }
        .checkout-btn:hover { background-color: #e0a800; }
        .table-input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>مینۆی خواردنە خۆشەکان</h1>

    <!-- بۆکسی گەڕان -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 گەڕان بە دوای ناوی خواردندا..." oninput="searchFoods()">
    </div>

    <!-- دوگمەکانی پۆلێنکردنی بەشەکان -->
    <div class="categories-nav" id="categoriesNav">
        <button class="cat-btn active" onclick="filterCategory('all', this)">هەمووی</button>
    </div>

    <!-- لیستی درێژی خواردنەکان -->
    <div class="menu-list" id="menuList">
        <!-- لێرەدا خواردنەکان دەردەکەون -->
    </div>

    <!-- سەبەتەی کڕین -->
    <div class="cart-box">
        <h3>سەبەتەی داواکاری</h3>
        <div id="cartItems" style="color: #666; margin-bottom: 15px;">سەبەتەکەت خاڵییە...</div>
        <hr style="border: 0; border-top: 1px solid #eee;">
        <p style="font-size: 18px; margin: 15px 0;"><strong>کۆی گشتی: <span id="totalPrice">0</span> دینار</strong></p>
        
        <div>
            <label style="font-weight: bold; color: #444;">ژمارەی مێز (Table Number):</label>
            <input type="number" id="tableNumber" class="table-input" placeholder="بۆ نموونە مێزی ژمارە 4">
        </div>
        
        <button class="checkout-btn" onclick="sendOrder()">ناردنی داواکاری بۆ ڕێستۆرانت</button>
    </div>
</div>

<script>
    const API_URL = 'http://127.0.0.1:5000/api';
    let allFoods = [];
    let cart = [];
    let currentCategory = 'all';

    window.onload = function() {
        fetchMenu();
    };

    function fetchMenu() {
        fetch(`${API_URL}/menu`)
            .then(res => res.json())
            .then(data => {
                allFoods = data.foods;
                renderCategories(data.categories);
                renderFoods(allFoods);
            })
            .catch(err => console.error('هەڵە:', err));
    }

    function renderCategories(categories) {
        const nav = document.getElementById('categoriesNav');
        nav.innerHTML = `<button class="cat-btn active" onclick="filterCategory('all', this)">هەمووی</button>`;
        categories.forEach(cat => {
            nav.innerHTML += `<button class="cat-btn" onclick="filterCategory('${cat}', this)">${cat}</button>`;
        });
    }

    function filterCategory(category, btn) {
        currentCategory = category;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        applyFilters();
    }

    // فەنکشنی گەڕان و فلتەرکردن بەیەکەوە
    function searchFoods() {
        applyFilters();
    }

    function applyFilters() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        
        let filtered = allFoods.filter(food => {
            const matchesCategory = (currentCategory === 'all' || food.category === currentCategory);
            const matchesSearch = food.name.toLowerCase().includes(searchText);
            return matchesCategory && matchesSearch;
        });

        renderFoods(filtered);
    }

    function renderFoods(foods) {
        const list = document.getElementById('menuList');
        list.innerHTML = '';
        
        if(foods.length === 0) {
            list.innerHTML = '<p style="text-align: center; color: #777;">هیچ خواردنێک نەدۆزرایەوە.</p>';
            return;
        }

        foods.forEach(food => {
            list.innerHTML += `
                <div class="food-row">
                    <img src="${food.image || 'https://via.placeholder.com/90'}" alt="${food.name}">
                    <div class="food-info">
                        <h3>${food.name}</h3>
                        <p>${food.price} دینار</p>
                    </div>
                    <button class="order-btn" onclick="addToCart(${food.id})">زیادکردن</button>
                </div>
            `;
        });
    }

    function addToCart(foodId) {
        const food = allFoods.find(f => f.id === foodId);
        if(!food) return;

        const existingItem = cart.find(item => item.id === foodId);
        if(existingItem) {
            existingItem.qty += 1;
        } else {
            cart.push({ ...food, qty: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const cartContainer = document.getElementById('cartItems');
        const totalPriceEl = document.getElementById('totalPrice');
        
        if(cart.length === 0) {
            cartContainer.innerHTML = 'سەبەتەکەت خاڵییە...';
            totalPriceEl.innerText = '0';
            return;
        }

        cartContainer.innerHTML = '';
        let total = 0;

        cart.forEach(item => {
            total += item.price * item.qty;
            cartContainer.innerHTML += `
                <div class="cart-item">
                    <span>${item.name} (${item.qty} عدد)</span>
                    <span>${item.price * item.qty} دینار</span>
                </div>
            `;
        });

        totalPriceEl.innerText = total;
    }

    function sendOrder() {
        const tableNum = document.getElementById('tableNumber').value.trim();
        if(!tableNum) {
            alert('تکایە ژمارەی مێزەکە بنووسە!');
            return;
        }
        if(cart.length === 0) {
            alert('سەبەتەکەت خاڵییە!');
            return;
        }

        const orderData = {
            table: tableNum,
            items: cart,
            total: document.getElementById('totalPrice').innerText
        };

        fetch(`${API_URL}/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        })
        .then(res => res.json())
        .then(data => {
            alert('داواکارییەکەت بە سەرکەوتوویی نێردرا!');
            cart = [];
            updateCartUI();
            document.getElementById('tableNumber').value = '';
        })
        .catch(err => alert('هەڵە ڕویدا'));
    }
</script>

</body>
</html>
